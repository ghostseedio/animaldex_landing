  #ark-ui { position: fixed; inset: 0; z-index: 4; pointer-events: none; color: #fffcf4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

  #ark-loader .aboard .n { font-variant-numeric: tabular-nums; color: rgba(255, 252, 244, 0.7); }

  body.ark-loading [data-ark-runtime="loading"] { opacity: 0 !important; }
</style>
<!-- The scene's code: fetched from the start, run only once the page has painted (the script at the foot): a script
     tag here or in the body held WebKit's first paint (the apps' iOS panel) for the whole ~1.6 MB download. -->
<script>
  // The Ark's code by this page's deploy (decision 360): the CDN lets a phone keep ./ark-scene.js for 4 hours, and a
  // new page with the old code broke Ark Lite (2026-11-15: setFounders missing, an empty page). This page is never
  // cached and its Last-Modified is the image's build time, so each deploy asks for its own code and workers; the
  // same deploy's stay cached. (No header: the time now, so fresh every load, never stale.) Since 2026-11-17 the versioned
  // address is also what the server lets a browser keep for good (`immutable`, next.config.js) and a bare one is asked
  // again every time; the scene reads this same `ARK_CODE_V` for the workers it starts itself (src/ark-scene/code-version.ts).
  window.ARK_CODE_V = "?v=" + (Date.parse(document.lastModified) || Date.now());
  (function () {
    var link = document.createElement("link");
    link.rel = "preload";
    link.as = "script";
    link.href = "./ark-scene.js" + window.ARK_CODE_V;
    document.head.appendChild(link);
  })();
</script>

<script>
/*
 * The loading screen, before the scene's code (src/lib/ark-loading.ts says what it shows and why). It runs as the page
 * is parsed, so the first paint already has the Ark's frame on it (blurred, from this file); it starts the Ark's words (and, reading its own, the
 * snapshot) beside the scene's code instead of after it; the script below drives it with the bundle's
 * `arkLoad…` functions. `?loader=0`: no screen of its own (the host shows one), the messages still go.
 * To the host: {type: "ark:progress", stage: "data"|"world"|"animals"|"done", progress: 0…1}, first at the first
 * paint (an app can show the page from then on instead of a spinner of its own), then at each real step.
 */

  var said = null;

  var iconImage = null;

  var lastPush = null;
  var pushes = 0;
  function takePush(message) {
    var snapshot = Ark.decodeArkSnapshot(message.snapshot);
    if (!snapshot) return;
    lastPush = {snapshot: message.snapshot, founders: message.founders};
    founders = foundersFrom(message, message.snapshot);
    wordsRead.then(function () { show(snapshot); });
  }
  function receive(message) {
    if (!message || typeof message !== "object") return;
    if (message.type === "ark:activity") { activity(); return; }
    if (message.type === "ark:extinct") { answerExtinct(); return; }
    if (message.type === "ark:visible" || message.type === "ark:power") {
      if (message.type === "ark:visible") {
        var shownBefore = hostVisible;
        hostVisible = !(message.visible === false || message.value === false);
        // Shown again with a read missed meanwhile: the Ark as it is now, once.
        if (!shownBefore && hostVisible && lastRead && Date.now() - lastRead >= refreshMs && document.visibilityState === "visible" && !(idleMs && Date.now() - lastActive >= idleMs)) read();
      }
      if (scene && scene.receive) scene.receive(message);
      else runtimeHeld[message.type] = message;
      return;
    }
    // (With two islands the world's handle takes the scene's messages while it mounts and passes them on once it is up.)
    var live = scene || mounting;
    if (live && message.type === "ark:reset") { live.resetView(); return; }
    if (message.type === "ark:snapshot") {
      var push = ++pushes;
      var before = lastPush;
      if (!before || !Ark.sameArkPush) { takePush(message); return; }
      Ark.sameArkPush(before.snapshot, message.snapshot)
        .then(function (same) { return same ? Ark.sameJsonSliced(before.founders, message.founders) : false; })
        .catch(function () { return false; })
        .then(function (same) {
          // (Overtaken by a newer push, which is being looked at itself; or the same Ark as is shown: nothing to do.)
          if (push !== pushes || (same && lastPush === before)) return;
          takePush(message);
        });
    }
    else if (live && message.type === "ark:mine") live.setMineOnly(Boolean(message.value));
    else if (message.type === "ark:select") {
      if (live) seeIt(live, message);
      else selectHeld = message;
    }
    else if (live && message.type === "ark:region") live.focusRegion(message.region || null);
    else if (scene && message.type === "ark:visitor") tell({type: "ark:visitor-id", id: scene.setVisitor(message.visitor || null)});
    // Lane ark-sd-align: any animal's rhythm, unselected (the home page's rhythm section): answered with ark:rhythm.
    else if (scene && message.type === "ark:rhythm-of" && message.id) { rhythmTold = ""; tellRhythm(String(message.id)); }
    else if (scene && message.type === "ark:talking") scene.setTalking(message.talking || null);
    else if (scene && message.type === "ark:talk-text") scene.talkText(String(message.chunk || ""));
    else if (scene && message.type === "ark:talk-pulse") scene.talkPulse(Number(message.level) || 0);
    else if (live && message.type === "ark:herd") live.selectHerd(message.key || null);
    else if (live && message.type === "ark:lite") live.setLite(message.value === true ? true : message.value === false ? false : null);
    else if (scene && message.type === "ark:sound" && message.value === false) setSound(false);
    else if (live && message.type === "ark:day") dayFor(live, message);
  }
  if (motion.addEventListener) motion.addEventListener("change", function () { if (scene) scene.setReducedMotion(motion.matches); });
  window.AnimalDexArkHost = {send: receive};
  window.addEventListener("message", function (event) { receive(event.data); });
  // (What the host said before this script ran, kept by the loading screen's script: said now, in order.)
  if (window.AnimalDexArkEarly) window.AnimalDexArkEarly().forEach(receive);

  read();
  setInterval(function () {
    // (Not while the page is hidden, nor while the host says the panel is covered or scrolled away, `ark:visible`:
    // the drawing has stopped then, and a read every 45 s behind a sheet or the chat is data and work nobody sees.)
    if (document.visibilityState !== "visible" || !hostVisible) return;
    if (idleMs && Date.now() - lastActive >= idleMs) return;
    read();
  }, refreshMs);
};
</script>
</body>
</html>
