# Unit tests, lint and types on GitHub's machines, so lanes don't run the full suite on the owner's Mac.
# Run by hand on any branch: gh workflow run ark-unit.yml -R ghostseedio/animaldex_landing --ref <branch>
name: Ark unit tests
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  unit:
    name: npm test, eslint, tsc
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests (src/lib/**/*.test.ts)
        run: npm test 2>&1 | tee unit.log; test ${PIPESTATUS[0]} -eq 0
        env:
          # This workflow holds no Supabase credentials on purpose (any branch can dispatch it), so the database privilege
          # contract is skipped here with its reason printed; src/lib/database-privilege-contract.test.ts says how it runs.
          DATABASE_CONTRACT_OPTIONAL: "1"
      - name: Ark bundles (the apps' Ark page needs public/ark/ark-ui.js and ark-ui.css; the build fails without them)
        run: |
          ARK_STAMP_EMBED=1 npm run build:ark
          for f in public/ark/ark-scene.js public/ark/ark-ui.js public/ark/ark-ui.css; do test -s "$f" || { echo "missing $f"; exit 1; }; done
          # The image's stamp (Dockerfile ARK_STAMP_EMBED=1): embed.html asks for this build's code version.
          v="$(tr -d '[:space:]' < public/ark/ark-version.txt)"
          grep -q "var ARK_BUILT_V = \"${v}\";" public/ark/embed.html || { echo "embed.html is not stamped with ${v}"; exit 1; }
          git checkout -- public/ark/embed.html
      - name: Lint
        run: npm run lint
      - name: Types (the known .svg module error is ignored; anything else fails)
        run: |
          npx tsc --noEmit -p . 2>&1 | tee tsc.log || true
          if grep -E "error TS" tsc.log | grep -v -E "\.svg" ; then exit 1; fi
      - name: Summary
        if: always()
        run: grep -E "^# (pass|fail|skipped)" unit.log >> "$GITHUB_STEP_SUMMARY" || true
