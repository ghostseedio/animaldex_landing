# Build & push AnimalDex standalone image to GHCR (linux/amd64).
# Manual only for now — no VM deploy, DNS, or Cloudflare steps.
name: Build self-host Docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo>  e.g. ghcr.io/ghostseedio/animaldex_landing
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "20.19.5"

jobs:
  build-and-push:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      image_sha_tag: ${{ steps.meta.outputs.sha_tag }}
      image_staging_tag: ${{ steps.meta.outputs.staging_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::12}"
          SHA_TAG="${REGISTRY}/${IMAGE_NAME}:sha-${SHA_SHORT}"
          STAGING_TAG="${REGISTRY}/${IMAGE_NAME}:selfhost-staging"
          FULL_SHA_TAG="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          {
            echo "sha_tag=${SHA_TAG}"
            echo "staging_tag=${STAGING_TAG}"
            echo "full_sha_tag=${FULL_SHA_TAG}"
            echo "sha_short=${SHA_SHORT}"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: ${SHA_TAG} ${STAGING_TAG}"

      - name: Resolve non-secret build args (names only; values from vars/defaults)
        id: buildargs
        env:
          VAR_CANONICAL_URL: ${{ vars.CANONICAL_URL }}
          VAR_NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          VAR_SITE_URL: ${{ vars.SITE_URL }}
          VAR_NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          VAR_NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          VAR_NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          VAR_NEXT_PUBLIC_INSTAGRAM_WEB_IMPORT_LIVE: ${{ vars.NEXT_PUBLIC_INSTAGRAM_WEB_IMPORT_LIVE }}
          VAR_GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
        run: |
          set_default() {
            local name="$1"
            local value="$2"
            local fallback="$3"
            if [ -z "$value" ]; then
              value="$fallback"
            fi
            echo "${name}=${value}" >> "$GITHUB_OUTPUT"
          }
          set_default canonical_url "${VAR_CANONICAL_URL}" "https://animaldex.app"
          set_default next_public_site_url "${VAR_NEXT_PUBLIC_SITE_URL}" "https://animaldex.app"
          set_default site_url "${VAR_SITE_URL}" "https://animaldex.app"
          set_default next_public_app_url "${VAR_NEXT_PUBLIC_APP_URL}" "https://animaldex.app"
          # Optional public config — empty is allowed (app has fallbacks)
          {
            echo "next_public_supabase_url=${VAR_NEXT_PUBLIC_SUPABASE_URL}"
            echo "next_public_ga_measurement_id=${VAR_NEXT_PUBLIC_GA_MEASUREMENT_ID}"
            echo "next_public_instagram_web_import_live=${VAR_NEXT_PUBLIC_INSTAGRAM_WEB_IMPORT_LIVE}"
            echo "google_analytics_id=${VAR_GOOGLE_ANALYTICS_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.full_sha_tag }}
            ${{ steps.meta.outputs.staging_tag }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            CANONICAL_URL=${{ steps.buildargs.outputs.canonical_url }}
            NEXT_PUBLIC_SITE_URL=${{ steps.buildargs.outputs.next_public_site_url }}
            SITE_URL=${{ steps.buildargs.outputs.site_url }}
            NEXT_PUBLIC_APP_URL=${{ steps.buildargs.outputs.next_public_app_url }}
            NEXT_PUBLIC_SUPABASE_URL=${{ steps.buildargs.outputs.next_public_supabase_url }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ steps.buildargs.outputs.next_public_ga_measurement_id }}
            NEXT_PUBLIC_INSTAGRAM_WEB_IMPORT_LIVE=${{ steps.buildargs.outputs.next_public_instagram_web_import_live }}
            GOOGLE_ANALYTICS_ID=${{ steps.buildargs.outputs.google_analytics_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify image architecture is linux/amd64
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.sha_tag }}"
          docker pull "$IMAGE"
          OS="$(docker image inspect --format '{{.Os}}' "$IMAGE")"
          ARCH="$(docker image inspect --format '{{.Architecture}}' "$IMAGE")"
          echo "Image OS/Arch: ${OS}/${ARCH}"
          test "$OS" = "linux"
          test "$ARCH" = "amd64"

      - name: Verify final image contains no .env* files
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.sha_tag }}"
          HITS="$(docker run --rm --entrypoint sh "$IMAGE" -c 'find /app -name ".env*" -type f 2>/dev/null || true')"
          if [ -n "$HITS" ]; then
            echo "::error::Forbidden .env* files found in image:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no .env* files under /app"

      - name: Smoke-test container (Nginx-equivalent Host / X-Forwarded-*)
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.sha_tag }}"
          NAME="animaldex-smoke-${GITHUB_RUN_ID}"

          docker run -d --name "$NAME" \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e HOSTNAME=0.0.0.0 \
            -e CANONICAL_URL="${{ steps.buildargs.outputs.canonical_url }}" \
            -e NEXT_PUBLIC_SITE_URL="${{ steps.buildargs.outputs.next_public_site_url }}" \
            -e SITE_URL="${{ steps.buildargs.outputs.site_url }}" \
            "$IMAGE"

          cleanup() {
            docker logs "$NAME" || true
            docker rm -f "$NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:3000/" \
              -H 'Host: animaldex.app' \
              -H 'X-Forwarded-Host: animaldex.app' \
              -H 'X-Forwarded-Proto: https'; then
              break
            fi
            sleep 2
            if [ "$i" -eq 60 ]; then
              echo "::error::Server did not become ready"
              exit 1
            fi
          done

          PROXY=(-H 'Host: animaldex.app' -H 'X-Forwarded-Host: animaldex.app' -H 'X-Forwarded-Proto: https')

          expect_status() {
            local path="$1"
            local want="$2"
            local loc_expect="${3:-}"
            local code loc
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-redirs 0 "${PROXY[@]}" "http://127.0.0.1:3000${path}")"
            loc="$(curl -sI --max-redirs 0 "${PROXY[@]}" "http://127.0.0.1:3000${path}" | awk 'tolower($1)=="location:" {print $2}' | tr -d '\r')"
            echo "${path} -> ${code} Location=${loc:-}"
            if [ "$code" != "$want" ]; then
              echo "::error::Expected ${want} for ${path}, got ${code}"
              exit 1
            fi
            if [ -n "$loc_expect" ] && [ "$loc" != "$loc_expect" ]; then
              echo "::error::Expected Location ${loc_expect} for ${path}, got ${loc}"
              exit 1
            fi
          }

          expect_status "/" 200
          expect_status "/animals/aardvark" 200
          expect_status "/animal-lessons/aardvark" 200
          expect_status "/pokemon-animals/generation-i" 200
          expect_status "/id/animals/tiger" 308 "/animals/tiger"
          expect_status "/animals/definitely-not-a-real-animaldex-slug" 404
          expect_status "/sitemap.xml" 200

          echo "Smoke tests passed"
