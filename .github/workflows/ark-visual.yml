# The Ark's visual regression (docs/ark/visual-ci.md): renders the golden shots in
# tests/ark-visual/config.json with WebGL on SwiftShader, the island clock frozen per
# shot, and compares them with tests/ark-visual/baselines within the tolerances there.
# Then the other lanes' checks in tests/ark-visual/hooks.json (the map's spawn
# validator, the intelligence scenarios, the behaviour audit), each once it lands.
#
# The run's pictures, diffs and report are uploaded as the `ark-visual` artifact. To
# accept new baselines: download it, `npx tsx scripts/ark-visual.mts accept --from <dir>`,
# commit tests/ark-visual/baselines. Or run this workflow by hand with `accept` on: the
# artifact's actual/ then holds the new baselines (still committed by hand).
#
# The models are read from the public model bucket (read only), as on the site.
name: Ark visual check

on:
  pull_request:
    paths:
      - "src/ark-scene/**"
      - "public/ark/**"
      - "tests/ark-visual/**"
      - "scripts/ark-visual.mts"
      - ".github/workflows/ark-visual.yml"
  workflow_dispatch:
    inputs:
      accept:
        description: "Write this run's pictures as the new baselines (in the artifact; commit them by hand)"
        type: boolean
        default: false
      only:
        description: "Only these shots (comma-separated ids, e.g. desktop-island_far-day)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ark-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Golden shots against the baselines
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Chromium (the build playwright-core pins, as on the Mac that took the baselines)
        run: npx playwright-core install --with-deps --no-shell chromium
      - name: Runtime unit tests
        run: npx tsx --test src/lib/ark-runtime-*.test.ts
      - name: Golden shots
        env:
          ACCEPT: ${{ inputs.accept }}
          ONLY: ${{ inputs.only }}
        run: |
          set -- --out .ark-golden/visual
          if [ "$ACCEPT" = "true" ]; then set -- "$@" --update; fi
          if [ -n "$ONLY" ]; then set -- "$@" --only "$ONLY"; fi
          npx tsx scripts/ark-visual.mts "$@"
      - name: Upload the pictures and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ark-visual
          path: .ark-golden/visual
          retention-days: 14

  hooks:
    name: The other lanes' checks (tests/ark-visual/hooks.json)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Chromium and ffmpeg (for hooks that drive the scene)
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Hooks
        run: npx tsx scripts/ark-visual.mts hooks
      - name: Upload the hooks' output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ark-hooks
          # (The town's own SwiftShader set writes .ark-golden/town/visual: its actual/ pictures are the ones accepted, decision 147.)
          path: |
            .ark-golden/ci
            .ark-golden/town/visual
          if-no-files-found: ignore
          retention-days: 14
